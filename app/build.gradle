plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    namespace 'com.banqiu.thirdparty123pan'
    // AndroidX Core 1.17.0 requires API 36; keep this independent of targetSdk.
    compileSdk 36

    defaultConfig {
        applicationId 'com.banqiu.thirdparty123pan'
        minSdk 29
        targetSdk 34
        versionCode 20
        versionName '2.0'
    }

    buildTypes {
        debug {
            if (providers.gradleProperty("glassPreview").isPresent()) {
                applicationIdSuffix ".glasspreview"
                versionNameSuffix "-glass-check"
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Hilt 聚合任务在 AGP 8.13 + Gradle 9 环境下存在 javapoet 类路径冲突，
// 禁用聚合任务（官方支持模式）：单模块 App 功能完全一致，只是放弃跨模块组件聚合。
hilt {
    enableAggregatingTask = false
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.compose.material.icons
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.navigation.compose

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.hilt.navigation.compose
    implementation libs.hilt.work

    // Hilt and Room KSP processors are declared above.

    // Network
    implementation libs.retrofit
    implementation libs.retrofit.kotlinx.serialization
    implementation libs.okhttp
    implementation libs.okhttp.logging
    implementation libs.kotlinx.serialization.json
    implementation libs.kotlinx.coroutines.android

    // Coil
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // DataStore / WorkManager
    implementation libs.datastore.preferences
    implementation libs.work.runtime.ktx

    // Backdrop refraction for the dock and switches; Haze remains for existing cards.
    implementation libs.backdrop
    implementation libs.capsule

    // Haze glass effect
    implementation libs.haze

    // Security
    implementation libs.security.crypto

    // QR code
    implementation libs.zxing.core

    testImplementation "junit:junit:4.13.2"
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"

    debugImplementation platform(libs.compose.bom)
    debugImplementation libs.compose.ui.tooling
}
// Export Room schema for migration verification.
ksp { arg("room.schemaLocation", "$projectDir/schemas") }

// Also expose the same JUnit classpath for Windows machines whose Gradle worker
// launcher cannot read a non-ASCII user-home path. This does not skip compilation.
tasks.register('exportUnitTestClasspath') {
    dependsOn 'compileDebugUnitTestKotlin', 'processDebugUnitTestJavaRes', 'transformDebugUnitTestClassesWithAsm'
    doLast {
        def output = layout.buildDirectory.file('unit-test-classpath.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = tasks.named('testDebugUnitTest').get().classpath.files.collect { it.absolutePath }.join('\n')
    }
}
